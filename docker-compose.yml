services:
  qdrant:
    image: qdrant/qdrant
    ports: ["6333:6333"]
    volumes: ["./qdrant_data:/qdrant/storage"]
  api:
    build: .
    ports: ["8001:8000"]
    env_file: .env
    environment:
      QDRANT_HOST: qdrant
      FASTEMBED_CACHE_PATH: /models
    volumes: ["./models:/models"]
    depends_on: [qdrant]